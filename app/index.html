<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<title>Live Interpretation Captions</title>
<style>
/* ============================================================
   design tokens - benchmarked against sconchat.com (2026-09-07)
   ============================================================ */
:root{
  --ink:#0B1220; --ink2:#1F2937; --ink3:#374151;
  --mut:#6B7280; --mut2:#9AA3B2;
  --line:#E8EBF2; --line2:#F0F2F8;
  --bg:#FFFFFF; --soft:#F6F8FD; --soft2:#FBFCFE;
  --ind:#4F46E5; --indd:#4338CA; --inds:#EEF0FE; --indb:#D9DCFB;
  --navy:#1E2540; --navyd:#141A2E; --navyl:#2A3252;
  --ok:#10B981; --warn:#F59E0B; --bad:#EF4444;
  --sh1:0 1px 2px rgba(11,18,32,.06);
  --sh2:0 4px 16px rgba(11,18,32,.08);
  --sh3:0 18px 48px rgba(11,18,32,.16);
  --r1:10px; --r2:14px; --r3:20px; --r4:28px;
  --fs:1;   /* caption font scale, driven by the 10-step control */
  --lh:1.55;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,
         "Apple SD Gothic Neo","Segoe UI","Malgun Gothic","Noto Sans KR",
         "Helvetica Neue",Roboto,sans-serif;
}
:root:not([data-theme="light"]){
  /* night mode is opt-in via the settings switch, not by system preference,
     because a sanctuary projector and a phone in a dark room want different
     things. the token block below is applied by [data-theme="dark"] only. */
}
:root[data-theme="dark"]{
  --ink:#F3F5FA; --ink2:#E2E6EF; --ink3:#C7CDDA;
  --mut:#98A1B4; --mut2:#77809A;
  --line:#26304A; --line2:#1E2740;
  --bg:#10162A; --soft:#161E36; --soft2:#131A31;
  --inds:#1E2650; --indb:#2C3670;
  --sh1:0 1px 2px rgba(0,0,0,.4);
  --sh2:0 4px 16px rgba(0,0,0,.45);
  --sh3:0 18px 48px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
.hide{display:none!important}

/* ============================================================
   app shell
   ============================================================ */
#app{min-height:100dvh;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
.bar{
  position:sticky;top:0;z-index:40;flex:0 0 auto;
  display:flex;align-items:center;gap:10px;
  height:56px;padding:0 16px;padding-top:env(safe-area-inset-top);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.glyph{width:26px;height:26px;flex:0 0 auto;border-radius:8px;
  background:linear-gradient(135deg,#6366F1,#4338CA);
  display:grid;place-items:center;box-shadow:0 2px 8px rgba(79,70,229,.35)}
.glyph svg{width:15px;height:15px;display:block}
.wm{font-weight:800;letter-spacing:-.02em;font-size:15.5px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wm em{font-style:normal;font-weight:600;color:var(--mut)}
.spacer{flex:1 1 auto}
.iconbtn{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  color:var(--ink3);transition:background .15s,color .15s;
}
.iconbtn:hover{background:var(--soft);color:var(--ink)}
.iconbtn svg{width:19px;height:19px;display:block}
.uilang{
  height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--ink3);background:var(--bg);
  display:flex;align-items:center;gap:5px
}

/* ============================================================
   SCREEN 1 - join
   ============================================================ */
#join{flex:1 1 auto;display:flex;flex-direction:column}
.wrap{width:100%;max-width:720px;margin:0 auto;padding:0 20px}
.hero{padding:34px 0 22px}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;
  border-radius:999px;background:var(--bg);border:1px solid var(--line);
  box-shadow:var(--sh1);font-size:12px;font-weight:700;color:var(--ind);
  letter-spacing:.01em;margin-bottom:16px
}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--ind);
  animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
h1.t{
  margin:0;font-size:clamp(28px,7.4vw,44px);line-height:1.24;
  font-weight:800;letter-spacing:-.033em;color:var(--ink)
}
h1.t .g{
  background:linear-gradient(100deg,#4F46E5,#6D63F0 60%,#4338CA);
  -webkit-background-clip:text;background-clip:text;color:transparent
}
p.sub{margin:14px 0 0;font-size:15px;line-height:1.65;color:var(--mut);max-width:34em}

.sect{margin-top:26px}
.lbl{
  display:flex;align-items:center;justify-content:space-between;
  font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut2);margin:0 0 11px
}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.lcard{
  position:relative;text-align:left;padding:14px 14px 13px;border-radius:var(--r2);
  border:1.5px solid var(--line);background:var(--bg);
  transition:border-color .16s,background .16s,transform .1s,box-shadow .16s;
}
.lcard:hover{border-color:var(--indb);box-shadow:var(--sh1)}
.lcard:active{transform:scale(.985)}
.lcard[aria-pressed="true"]{border-color:var(--ind);background:var(--inds);box-shadow:var(--sh1)}
.lcard .code{
  display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.09em;
  color:var(--mut2);text-transform:uppercase;margin-bottom:6px
}
.lcard[aria-pressed="true"] .code{color:var(--ind)}
.lcard .nat{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.lcard .eng{display:block;font-size:11.5px;color:var(--mut);margin-top:2px}
.lcard .tick{
  position:absolute;top:11px;right:11px;width:18px;height:18px;border-radius:50%;
  background:var(--ind);display:none;place-items:center
}
.lcard[aria-pressed="true"] .tick{display:grid}
.lcard .tick svg{width:11px;height:11px;color:#fff}

.field{
  width:100%;height:48px;padding:0 14px;border-radius:var(--r2);
  border:1.5px solid var(--line);background:var(--bg);color:var(--ink);
  font-size:15px;outline:none;transition:border-color .16s,box-shadow .16s
}
.field::placeholder{color:var(--mut2)}
.field:focus{border-color:var(--ind);box-shadow:0 0 0 4px var(--inds)}

.notice{
  margin-top:22px;display:flex;gap:11px;padding:14px 15px;border-radius:var(--r2);
  background:var(--soft);border:1px solid var(--line2)
}
.notice svg{width:17px;height:17px;flex:0 0 auto;margin-top:1px;color:var(--warn)}
.notice b{display:block;font-size:12.5px;font-weight:800;color:var(--ink2);margin-bottom:3px}
.notice p{margin:0;font-size:12.5px;line-height:1.62;color:var(--mut)}

.cta{
  position:sticky;bottom:0;margin-top:26px;padding:14px 0 calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 62%,transparent)
}
.btn{
  width:100%;height:54px;border-radius:var(--r2);font-size:16px;font-weight:700;
  letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .1s,box-shadow .16s,background .16s
}
.btn.pri{background:var(--ind);color:#fff;box-shadow:0 6px 20px rgba(79,70,229,.32)}
.btn.pri:hover{background:var(--indd)}
.btn.pri:active{transform:scale(.988)}
.btn.pri:disabled{background:var(--line);color:var(--mut2);box-shadow:none;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.foot{padding:0 0 30px;font-size:11.5px;color:var(--mut2);text-align:center;line-height:1.7}
.notice+.cta{margin-top:18px}
.foot code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}

/* ============================================================
   SCREEN 2 - live
   ============================================================ */
#live{flex:1 1 auto;display:flex;flex-direction:column;min-height:100dvh}
.livebar{
  position:sticky;top:0;z-index:40;flex:0 0 auto;
  padding-top:env(safe-area-inset-top);
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line)
}
.lbrow{display:flex;align-items:center;gap:8px;height:52px;padding:0 10px 0 6px}
.room{min-width:0;flex:1 1 auto}
.room .rt{font-size:14.5px;font-weight:750;letter-spacing:-.015em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.room .rs{font-size:11px;color:var(--mut2);margin-top:1px}
.langpill{
  height:30px;padding:0 11px;border-radius:999px;background:var(--inds);
  color:var(--ind);font-size:12.5px;font-weight:750;display:flex;align-items:center;gap:5px;
  border:1px solid var(--indb)
}
.langpill svg{width:12px;height:12px}

/* health strip - the defect surface. this is deliberate: the bridge can die
   silently, so the guest must be able to see staleness without asking. */
.health{
  display:flex;align-items:center;gap:8px;padding:8px 16px;
  font-size:12px;font-weight:600;color:var(--mut);
  background:var(--soft2);border-top:1px solid var(--line2);
  transition:background .3s,color .3s
}
.health .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent);
  transition:background .3s,box-shadow .3s}
.health.warn{background:#FFF8EC;color:#92610C}
:root[data-theme="dark"] .health.warn{background:#3A2A08;color:#F5C86B}
.health.warn .dot{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 25%,transparent)}
.health.bad{background:#FEF1F1;color:#A32020}
:root[data-theme="dark"] .health.bad{background:#3E1414;color:#F79393}
.health.bad .dot{background:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 25%,transparent);
  animation:pulse 1.4s ease-in-out infinite}
.health .rt{margin-left:auto;font-variant-numeric:tabular-nums;font-size:11px;color:inherit;opacity:.72}

/* caption stream */
#stream{
  flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:8px 16px calc(96px + env(safe-area-inset-bottom));
  scroll-behavior:smooth
}
.daydiv{display:flex;align-items:center;gap:12px;margin:16px 2px 12px}
.daydiv:before,.daydiv:after{content:"";flex:1;height:1px;background:var(--line)}
.daydiv span{font-size:10.5px;font-weight:700;letter-spacing:.07em;color:var(--mut2);
  text-transform:uppercase;font-variant-numeric:tabular-nums}

/* a turn is NOT a bubble. speaker header + flat text on the page, the way
   sconchat does it. bubbles were the single biggest thing that made v1 read
   as a toy. */
.turn{padding:13px 0;border-bottom:1px solid var(--line2);animation:rise .28s cubic-bezier(.2,.7,.3,1)}
.turn:last-child{border-bottom:0}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.thead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.av{
  width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-size:10.5px;font-weight:800;color:#fff;letter-spacing:-.02em;
  background:linear-gradient(135deg,#6366F1,#4338CA)
}
.av.s1{background:linear-gradient(135deg,#0EA5E9,#0369A1)}
.av.s2{background:linear-gradient(135deg,#10B981,#047857)}
.who{font-size:12.5px;font-weight:750;color:var(--ink2);letter-spacing:-.01em}
.tm{font-size:10.5px;color:var(--mut2);font-variant-numeric:tabular-nums}
.tbody{
  font-size:calc(16px * var(--fs));line-height:var(--lh);color:var(--ink);
  letter-spacing:-.006em;word-break:keep-all;overflow-wrap:anywhere
}
/* secondary target language. the owner's original ask (2026-08-31) was
   Tagalog + English + Korean at once - sconchat is one-language-per-viewer product and
   structurally cannot do this, so this block is ours, not benchmarked. */
.tsec{
  margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);
  font-size:calc(14px * var(--fs));line-height:var(--lh);color:var(--ink3);
  word-break:keep-all;overflow-wrap:anywhere
}
.tsec .lc{
  display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.07em;
  color:var(--mut2);margin-right:7px;vertical-align:.08em
}
.torig{
  margin-top:8px;padding-left:11px;border-left:2px solid var(--line);
  font-size:calc(13px * var(--fs));line-height:calc(var(--lh) - .08);color:var(--mut);
  word-break:keep-all;overflow-wrap:anywhere
}
/* operator pause / session end are first-class states: a silent screen must
   never be ambiguous (boundary 2-5, no silent failure). */
.endcard{
  margin:34px auto;max-width:22em;text-align:center;padding:26px 20px;
  border-radius:var(--r3);background:var(--soft);border:1px solid var(--line2)
}
.endcard .ei{width:40px;height:40px;margin:0 auto 13px;border-radius:50%;
  background:var(--inds);display:grid;place-items:center;color:var(--ind)}
.endcard .ei svg{width:20px;height:20px}
.endcard b{display:block;font-size:15.5px;font-weight:750;margin-bottom:5px}
.endcard p{margin:0;font-size:12.5px;color:var(--mut);line-height:1.6}
.pend{margin-left:auto;font-size:9.5px;font-weight:800;letter-spacing:.03em;
  color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent);
  border-radius:999px;padding:2px 7px;white-space:nowrap}
.turn.partial .tbody{color:var(--mut)}
.turn.partial .tbody:after{
  content:"";display:inline-block;width:2px;height:1em;margin-left:3px;
  background:var(--ind);vertical-align:-.14em;animation:blink 1s steps(1) infinite
}
@keyframes blink{50%{opacity:0}}

.empty{padding:64px 8px;text-align:center;color:var(--mut2)}
.empty .ring{width:46px;height:46px;margin:0 auto 16px;border-radius:50%;
  border:2.5px solid var(--line);border-top-color:var(--ind);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty p{margin:0;font-size:13.5px}
.wmark{
  text-align:right;padding:18px 2px 4px;font-size:9.5px;font-weight:800;
  letter-spacing:.09em;color:var(--mut2);opacity:.5;user-select:none
}

/* jump-to-latest */
.jump{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;
  height:34px;padding:0 15px;border-radius:999px;background:var(--ind);color:#fff;
  font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;
  box-shadow:0 6px 20px rgba(79,70,229,.4)
}
.jump svg{width:13px;height:13px}

/* bottom control dock */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:35;
  padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line);
  display:flex;align-items:center;gap:8px
}
.stepper{display:flex;align-items:center;gap:2px;background:var(--soft);
  border:1px solid var(--line);border-radius:999px;padding:3px;height:38px}
.stepper button{width:32px;height:30px;border-radius:999px;display:grid;place-items:center;
  color:var(--ink3);font-weight:800;font-size:15px}
.stepper button:active{background:var(--bg)}
.stepper .val{min-width:32px;height:30px;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:800;color:var(--mut);font-variant-numeric:tabular-nums;
  letter-spacing:-.01em}
.tog{
  height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--soft);color:var(--mut);font-size:12.5px;font-weight:700;
  display:flex;align-items:center;gap:6px;transition:.15s
}
.tog svg{width:14px;height:14px}
.tog[aria-pressed="true"]{background:var(--inds);border-color:var(--indb);color:var(--ind)}
.dock .grow{flex:1 1 auto}

/* ============================================================
   settings sheet
   ============================================================ */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(11,18,32,.42);
  backdrop-filter:blur(2px);animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);
  border-radius:var(--r4) var(--r4) 0 0;box-shadow:var(--sh3);
  padding:8px 20px calc(22px + env(safe-area-inset-bottom));
  max-height:86dvh;overflow-y:auto;animation:up .26s cubic-bezier(.2,.8,.3,1)
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.handle{width:38px;height:4px;border-radius:999px;background:var(--line);margin:6px auto 14px}
.sheet h2{margin:0 0 16px;font-size:17px;font-weight:800;letter-spacing:-.02em}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:13px 0;border-bottom:1px solid var(--line2)}
.row:last-of-type{border-bottom:0}
.row .rl{font-size:14px;font-weight:650;color:var(--ink2)}
.row .rd{font-size:11.5px;color:var(--mut2);margin-top:2px}
.sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;
  flex:0 0 auto;transition:background .18s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:var(--sh1);transition:transform .18s}
.sw[aria-pressed="true"]{background:var(--ind)}
.sw[aria-pressed="true"]:after{transform:translateX(18px)}
.seg{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);
  border-radius:999px;padding:3px}
.seg button{height:28px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ind);box-shadow:var(--sh1)}
.seg.wrap2{border-radius:13px;flex-wrap:wrap;justify-content:flex-end;max-width:66%;padding:4px}
.seg.wrap2 button{border-radius:9px;padding:0 10px}
.rng{display:flex;align-items:center;gap:11px}
.rng .rv{min-width:34px;text-align:right;font-size:12px;font-weight:800;color:var(--ind);
  font-variant-numeric:tabular-nums}
.slider{width:132px;accent-color:var(--ind)}
.sheetcta{margin-top:18px}

/* ============================================================
   SCREEN 3 - projector
   ============================================================ */
#big{
  position:fixed;inset:0;z-index:80;background:var(--navyd);color:#fff;
  display:flex;flex-direction:column;padding:clamp(20px,4vw,54px)
}
#big .bhead{display:flex;align-items:center;gap:10px;flex:0 0 auto}
#big .bpill{height:30px;padding:0 13px;border-radius:999px;
  background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.16);
  font-size:13px;font-weight:700;display:flex;align-items:center;color:#E6E9F5}
#big .bdot{width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:8px;
  box-shadow:0 0 0 4px rgba(16,185,129,.2)}
#big .bdot.stale{background:var(--warn);box-shadow:0 0 0 4px rgba(245,158,11,.2)}
#big .bx{margin-left:auto;color:rgba(255,255,255,.5)}
#big .bx svg{width:22px;height:22px}
#bigbody{
  flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-end;
  gap:clamp(14px,2vw,26px);overflow:hidden;padding:clamp(18px,3vw,40px) 0;
  /* older lines scroll off the top; fade them instead of slicing a glyph in half */
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 56px);
  mask-image:linear-gradient(to bottom,transparent 0,#000 56px)
}
#bigbody .bl{
  font-size:calc(clamp(22px,3.6vw,46px) * var(--fs));line-height:1.34;font-weight:700;
  letter-spacing:-.022em;color:#fff;word-break:keep-all;overflow-wrap:anywhere;
  animation:rise .3s cubic-bezier(.2,.7,.3,1)
}
#bigbody .bl.old{color:rgba(255,255,255,.3);font-weight:600;
  font-size:calc(clamp(18px,2.6vw,32px) * var(--fs))}

var AVC=["","s1","s2"];
function initial(s){ s=String(s||"").trim(); return s? s.slice(0,1).toUpperCase() : "P"; }
function hhmm(ts){
  var d=new Date(ts||Date.now());
  var h=d.getHours(), m=d.getMinutes(), ap=h<12?"AM":"PM";
  h=h%12; if(h===0)h=12;
  return h+":"+(m<10?"0":"")+m+" "+ap;
}
function dayKey(ts){
  var d=new Date(ts||Date.now());
  var W=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return W[d.getDay()]+" "+M[d.getMonth()]+" "+d.getDate()+" "+d.getFullYear();
}
/* returns {s:<string to show>, fb:<true if this is NOT the chosen language>}.
   the relay fills languages in one at a time under the same seq, so a row can
   exist with only the korean original for a second or two. showing the korean
   with a small badge beats showing an empty line. */
function textIn(t,code){
  if(code==="ko") return t.ko || (t.tr&&t.tr.ko) || "";
  return (t.tr && t.tr[code]) || "";
}
function textOf(t){
  var v=textIn(t,S.lang);
  if(v) return {s:v, fb:false};
  if(t.text) return {s:t.text, fb:false};
  if(t.ko) return {s:t.ko, fb:true};
  if(t.tr){ for(var k in t.tr){ if(t.tr[k]) return {s:t.tr[k], fb:true}; } }
  return {s:"", fb:false};
}

/* seq identity matters. the 8779 relay re-broadcasts the SAME seq once per
   language as each translation lands, so an append-only client would print the
   korean line, then the tagalog line, then the english line as three separate
   turns. rows are therefore merged by id. */
var _localSeq=0;
function pushTurn(t){
  t.ts = t.ts || Date.now();
  if(!t.id) t.id = "L"+(++_localSeq);
  var tail = S.turns[S.turns.length-1];

  if(t.partial){
    if(tail && tail.partial) S.turns[S.turns.length-1]=t; else S.turns.push(t);
  } else {
    var idx=-1, floor=Math.max(0,S.turns.length-80);
    for(var i=S.turns.length-1;i>=floor;i--){
      if(!S.turns[i].partial && S.turns[i].id===t.id){ idx=i; break; }
    }
    if(idx>=0){
      var prev=S.turns[idx];
      t.ts = prev.ts;                          /* keep first-arrival time */
      t.ko = t.ko || prev.ko;
      t.tr = Object.assign({}, prev.tr||{}, t.tr||{});
      t.text = t.text || prev.text;
      S.turns[idx]=t;
    } else if(tail && tail.partial){
      S.turns[S.turns.length-1]=t;             /* final replaces the partial */
    } else {
      S.turns.push(t);
    }
  }
  if(S.turns.length>400) S.turns=S.turns.slice(-400);
  S.lastAt=Date.now();
  renderTurns();
  paintHealth();
}

/* accepts BOTH shapes:
   a) the live 8779 relay   {"kind":"caption","seq":"in3","ko":"...","tl":"..."}
                            {"kind":"partial","text":"..."}
   b) a generic bridge      {"type":"caption","tr":{...},"ko":"...","ts":...}
   plus a bare string, which older bridges emit. */
function normalize(m){
  if(typeof m === "string") m = {text:m};
  var kind = m.kind || m.type || "caption";
  if(kind==="pong" || kind==="ack" || kind==="hello") return null;
  if(kind==="status" || kind==="session"){
    var st = m.state || m.status || "";
    if(st==="paused"||st==="pause"){ S.sess="paused"; }
    else if(st==="ended"||st==="end"||st==="closed"){ S.sess="ended"; }
    else if(st==="live"||st==="resumed"||st==="resume"){ S.sess="live"; }
    renderTurns(); paintHealth();
    return null;
  }
  if(S.sess==="paused" || S.sess==="ended") S.sess="live";   /* captions imply live */

  if(kind==="partial"){
    var pt = String(m.text||"").trim();
    if(!pt) return null;
    return {id:"__p__", partial:true, ko:pt, text:pt, tr:null, ts:Date.now(),
            speaker:m.speaker||T("spk.pastor"), spkIdx:m.spkIdx||0};
  }

  var tr={}, i, c, k;
  for(i=0;i<LANGS.length;i++){ c=LANGS[i].c; if(m[c]) tr[c]=m[c]; }
  if(m.tr)           for(k in m.tr)           if(m.tr[k]) tr[k]=m.tr[k];
  if(m.translations) for(k in m.translations) if(m.translations[k]) tr[k]=m.translations[k];

  var ko  = m.ko || m.original || m.source || tr.ko || "";
  var txt = m.text || m.translation || "";
  if(!ko && !txt){ var any=false; for(k in tr){ any=true; break; } if(!any) return null; }

  return {
    id      : (m.seq!==undefined && m.seq!==null) ? "S"+m.seq : null,
    partial : false,
    speaker : m.speaker || m.name || T("spk.pastor"),
    spkIdx  : m.spkIdx || 0,
    ts      : m.ts ? (String(m.ts).length>11 ? Number(m.ts) : Number(m.ts)*1000) : Date.now(),
    ko      : ko,
    text    : txt,
    tr      : tr
  };
}

/* ==========================================================================
   health strip. this is the whole reason the guest can trust the screen:
   the bridge has died silently before, and a frozen caption looks identical
   to a pause in the sermon. the counter makes the difference visible.
   ========================================================================== */
function paintHealth(){
  var h=$("health"), d=$("hDot"), x=$("hTxt"), c=$("hClock");
  if(!h) return;
  var now=new Date();
  c.textContent = hhmm(now.getTime());
  h.classList.remove("warn","bad");
  if(S.sess==="ended"){ x.textContent=T("st.ended"); return; }
  if(S.sess==="bad"){ x.textContent=T("st.bad"); h.classList.add("bad"); return; }
  if(S.sess==="paused"){ x.textContent=T("st.paused"); h.classList.add("warn"); return; }
  if(S.demo){ x.textContent=T("h.demo"); h.classList.add("warn"); return; }
  if(S.conn==="connecting"){ x.textContent=T("h.connecting"); h.classList.add("warn"); return; }
  if(S.conn==="closed"){ x.textContent=T("h.dead"); h.classList.add("bad"); return; }
  if(!S.lastAt){ x.textContent=T("h.waiting"); return; }
  var s=Math.round((Date.now()-S.lastAt)/1000);
  var msg=T("h.pre")+s+T("h.post");
  if(s>=45){ msg+=T("h.stale"); h.classList.add("bad"); }
  else if(s>=20){ msg+=T("h.stale"); h.classList.add("warn"); }
  x.textContent=msg;
  var bd=$("bDot"); if(bd) bd.className="bdot"+(s>=20?" stale":"");
}
setInterval(paintHealth,1000);

/* ==========================================================================
   transport
   ========================================================================== */
var ws=null, tries=0, candIdx=0, cands=[];
function buildCands(){
  var q=Q.get("ws");
  if(q){ cands=[q]; return; }
  /* 앱(고정 원점)은 자기 주소에 /ws 가 없다 - app.js 가 url.json 에서 읽은 현재 터널만 쓴다 */
  cands = window.__tunnelWs ? [window.__tunnelWs] : [];
}
/* ★2026-09-19 수정. 예전엔 후보 주소를 두 바퀴 돌아 다 실패하면 startDemo() 로 떨어져
   다시는 서버에 붙지 않았다. 폰 와이파이가 몇 초 끊기거나 서버를 재기동하면(09-19 실측:
   중계기 재기동 뒤 clients=0 고정) 교인 화면에 샘플 자막이 흐르고 진짜 자막은 안 돌아왔다.
   데모는 ?demo=1 로 부를 때만 뜬다. 그 밖에는 1-2-4-8-10초 간격으로 끝까지 다시 붙는다. */
var _rt=null;
function later(ms){ if(_rt) clearTimeout(_rt); _rt=setTimeout(function(){ _rt=null; connect(); }, ms); }
function connect(){
  if(Q.get("demo")==="1"){ startDemo(); return; }
  if(ws && (ws.readyState===0 || ws.readyState===1)) return;
  if(candIdx>=cands.length){
    candIdx=0; tries++;
    if(window.__refreshTunnel){ window.__refreshTunnel().then(function(){ buildCands(); }); }
    S.conn="closed"; paintHealth();
    later(Math.min(10000, 1000*Math.pow(2, Math.min(tries-1, 4))));
    return;
  }
  var url=cands[candIdx];
  $("endpoint").textContent=url;
  $("roomSub").textContent=url.replace(/^wss?:\/\//,"");
  S.conn="connecting"; paintHealth();
  var sock;
  try{ sock=new WebSocket(url); }catch(e){ candIdx++; later(300); return; }
  ws=sock;
  var settled=false;
  var to=setTimeout(function(){ if(!settled){ try{sock.close();}catch(e){} } },3500);
  sock.onopen=function(){
    settled=true; clearTimeout(to); S.conn="open"; S.demo=false; tries=0;
    try{ sock.send(JSON.stringify({type:"hello",lang:S.lang,lang2:S.lang2})); }catch(e){}
    paintHealth();
  };
  sock.onmessage=function(ev){
    var m;
    try{ m=JSON.parse(ev.data); }catch(e){ m={text:String(ev.data)}; }
    var t=normalize(m);
    if(t) pushTurn(t);
  };
  sock.onclose=function(){
    clearTimeout(to);
    if(S.conn!=="open"){ candIdx++; later(300); return; }
    S.conn="closed"; paintHealth();
    candIdx=0; later(2000);
  };
  sock.onerror=function(){ try{sock.close();}catch(e){} };
}
var demoTimer=null;
function startDemo(){
  S.demo=true; S.conn="open"; paintHealth();
  $("roomSub").textContent="demo";
  var i=0;
  if(demoTimer) clearInterval(demoTimer);
  function emit(){
    var d=DEMO[i%DEMO.length]; var seq="d"+i; i++;
    /* mirror the relay exactly: korean original lands first under a seq, the
       translations arrive a beat later under the SAME seq. if the merge logic
       is wrong this shows up immediately as duplicated lines. */
    pushTurn(normalize({kind:"caption",seq:seq,ko:d.ko}));
    setTimeout(function(){
      pushTurn(normalize({kind:"caption",seq:seq,ko:d.ko,tl:d.tl,ceb:d.tl,en:d.en,zh:d.en,ja:d.en}));
    },900);
  }
  emit();
  demoTimer=setInterval(emit,6500);
}

  }, function(v){ return v+""; }));
  sh.appendChild(rowSw(T("set.dualL"),T("set.dualD"),S.dual,function(v){
    S.dual=v; LS.set("dual",v);
    $("dualTog").setAttribute("aria-pressed",v?"true":"false"); renderTurns();
  }));
  sh.appendChild(rowSw(T("set.auto"),T("set.autoD"),S.auto,function(v){
    S.auto=v; LS.set("auto",v); if(v) scrollBottom();
  }));
  sh.appendChild(rowSw(T("set.dark"),T("set.darkD"),S.dark,function(v){
    S.dark=v; LS.set("dark",v); applyTheme();
  }));
  sh.appendChild(rowSw(T("set.wake"),T("set.wakeD"),S.wake,function(v){
    S.wake=v; LS.set("wake",v); applyWake();
  }));

  var cta=document.createElement("div"); cta.className="sheetcta";
  var b=document.createElement("button"); b.type="button"; b.className="btn pri";
  b.textContent=T("set.done"); cta.appendChild(b); sh.appendChild(cta);

  function close(){ try{scrim.remove();sh.remove();}catch(e){} }
  b.addEventListener("click",close);
  scrim.addEventListener("click",close);
  document.body.appendChild(scrim); document.body.appendChild(sh);
}
function rowShell(label,desc){
  var r=document.createElement("div"); r.className="row";
  var l=document.createElement("div");
  var a=document.createElement("div"); a.className="rl"; a.textContent=label; l.appendChild(a);
  if(desc){ var d=document.createElement("div"); d.className="rd"; d.textContent=desc; l.appendChild(d); }
  r.appendChild(l); return r;
}
function rowSw(label,desc,val,cb){
  var r=rowShell(label,desc);
  var s=document.createElement("button"); s.type="button"; s.className="sw";
  s.setAttribute("aria-pressed",val?"true":"false");
  s.addEventListener("click",function(){
    var nv=s.getAttribute("aria-pressed")!=="true";
    s.setAttribute("aria-pressed",nv?"true":"false"); cb(nv);
  });
  r.appendChild(s); return r;
}
function rowRange(label,desc,min,max,step,val,cb,fmt){
  var r=rowShell(label,desc);
  var box=document.createElement("div"); box.className="rng";
  var i=document.createElement("input"); i.type="range"; i.className="slider";
  i.min=min; i.max=max; i.step=step; i.value=val;
  var v=document.createElement("span"); v.className="rv";
  v.textContent = fmt?fmt(val):val;
  i.addEventListener("input",function(){
    var n=parseFloat(i.value); v.textContent = fmt?fmt(n):n; cb(n);
  });
  box.appendChild(i); box.appendChild(v); r.appendChild(box); return r;
}
function rowSeg(label,desc,opts,val,cb){
  var r=rowShell(label,desc);
  var g=document.createElement("div"); g.className="seg wrap2";
  opts.forEach(function(o){
    var b=document.createElement("button"); b.type="button"; b.textContent=o.t;
    b.setAttribute("aria-pressed",o.v===val?"true":"false");
    b.addEventListener("click",function(){
      var all=g.querySelectorAll("button");
      for(var i=0;i<all.length;i++) all[i].setAttribute("aria-pressed","false");
      b.setAttribute("aria-pressed","true"); cb(o.v);
    });
    g.appendChild(b);
  });
  r.appendChild(g); return r;
}

/* ==========================================================================
   apply helpers
   ========================================================================== */
function applyFs(){
  var i=Math.max(1,Math.min(10,S.fs));
  document.documentElement.style.setProperty("--fs",FS_STEPS[i-1]);
  $("fsVal").textContent=i;
}
function applyTheme(){
  document.documentElement.setAttribute("data-theme", S.dark?"dark":"light");
  var m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", S.dark?"#10162A":"#ffffff");
}
function applyWake(){
  if(!("wakeLock" in navigator)) return;
  if(S.wake){
    navigator.wakeLock.request("screen").then(function(w){ S.wl=w; }).catch(function(){});
  } else if(S.wl){ try{S.wl.release();}catch(e){} S.wl=null; }
}
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible" && S.wake) applyWake();
  /* 화면을 껐다 켜면 폰이 소켓을 끊어 두는 일이 잦다 — 돌아오는 즉시 다시 붙는다. */
  if(document.visibilityState==="visible" && S.conn!=="open" && !S.demo && cands.length){ candIdx=0; later(0); }
});
window.addEventListener("online",function(){
  if(S.conn!=="open" && !S.demo && cands.length){ candIdx=0; later(0); }
});

/* ==========================================================================
   screen routing
   ========================================================================== */
function goLive(){
  $("join").classList.add("hide"); $("live").classList.remove("hide");
  applyWake(); renderTurns();
  (window.__refreshTunnel ? window.__refreshTunnel() : Promise.resolve()).then(function(){ buildCands(); connect(); });
}
function goJoin(){
  $("live").classList.add("hide"); $("join").classList.remove("hide");
}
function goBig(){
  $("big").classList.remove("hide"); renderBig();
  var el=document.documentElement;
  if(el.requestFullscreen) el.requestFullscreen().catch(function(){});
}
function exitBig(){
  $("big").classList.add("hide");
  if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function(){});
}

/* ==========================================================================
   wiring
   ========================================================================== */
$("startBtn").addEventListener("click",goLive);
$("backBtn").addEventListener("click",goJoin);
$("gearBtn").addEventListener("click",openSheet);
$("langPill").addEventListener("click",openSheet);
$("bigBtn").addEventListener("click",goBig);
$("bigClose").addEventListener("click",exitBig);
$("big").addEventListener("click",function(e){ if(e.target.id==="big"||e.target.id==="bigbody") exitBig(); });
$("fsUp").addEventListener("click",function(){ S.fs=Math.min(10,S.fs+1); LS.set("fs",S.fs); applyFs(); });
$("fsDown").addEventListener("click",function(){ S.fs=Math.max(1,S.fs-1); LS.set("fs",S.fs); applyFs(); });
$("dualTog").addEventListener("click",function(){
  S.dual=!S.dual; LS.set("dual",S.dual);
  $("dualTog").setAttribute("aria-pressed",S.dual?"true":"false"); renderTurns();
});
$("jumpBtn").addEventListener("click",scrollBottom);
$("stream").addEventListener("scroll",function(){
  var s=$("stream");
  var near = s.scrollHeight - s.scrollTop - s.clientHeight < 90;
  $("jumpBtn").classList.toggle("hide", near);
});
$("uilangBtn").addEventListener("click",function(){
  var order=["entl","ko","en","tl"];
  S.ui = order[(order.indexOf(S.ui)+1)%order.length];
  LS.set("ui",S.ui); applyI18n();
});
document.addEventListener("keydown",function(e){
  var inBig = !$("big").classList.contains("hide");
  if(e.key==="Escape" && inBig){ exitBig(); return; }
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.key==="+"||e.key==="="){ S.fs=Math.min(10,S.fs+1); LS.set("fs",S.fs); applyFs(); }
  else if(e.key==="-"||e.key==="_"){ S.fs=Math.max(1,S.fs-1); LS.set("fs",S.fs); applyFs(); }
  else if(e.key==="f"||e.key==="F"||e.key==="F11"){
    if(e.key==="F11") e.preventDefault();
    if(!$("live").classList.contains("hide")) goBig();
  }
  else if(e.key==="o"||e.key==="O"){ $("dualTog").click(); }
  else if(e.altKey){
    var map={k:"ko",e:"en",j:"ja",z:"zh",t:"tl",c:"ceb"};
    var code=map[String(e.key).toLowerCase()];
    if(code){
      e.preventDefault();
      S.lang=code; LS.set("lang",code);
      if(S.lang2===S.lang){ S.lang2=""; LS.set("lang2",""); }
      var L=pickLang(code);
      $("langPillTxt").textContent=L?L.nat:code; $("bLang").textContent=L?L.nat:code;
      buildGrid(); buildGrid2(); renderTurns();
    }
  }
});

/* boot */
applyTheme(); applyFs();
document.documentElement.style.setProperty("--lh",S.lh);
$("dualTog").setAttribute("aria-pressed",S.dual?"true":"false");
buildGrid(); buildGrid2(); applyI18n(); buildCands();
$("endpoint").textContent = cands[0]||"-";
if(Q.get("auto")==="1" || Q.get("demo")==="1") goLive();
})();
</script>
